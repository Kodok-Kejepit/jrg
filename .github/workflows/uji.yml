# Menjalankan suite di tiap dorongan dan tiap pull request.
#
# Terpisah dari `rilis.yml` dengan sengaja: yang ini harus berjalan sering dan
# cepat, sementara yang itu cuma pada tag dan membangun semua platform.

name: uji

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    # Profil rilis tanpa LTO dan dengan codegen-units 16, KHUSUS uji: biner yang dirilis (`rilis.yml`) tetap LTO.
    # Tiap biner tes ditaut ulang dengan LTO dan satu unit kode, dan itu bagian terbesar job ini (17 dari 37 menit).
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4

      - name: Pasang toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Jembatan LLVM dibangun SEBELUM suite: kalau basi, tes `--emit-llvm` pertama membangunnya di tengah jalan.
      - name: Pustaka --emit-llvm
        run: |
          cargo build --release -j 2
          (cd runtime && cargo build --release)
          (cd jembatan && cargo build --release)

      # Mesin kelima (`--emit-wasm`): sysroot dan compiler-rt wasi-sdk plus binaryen (`wasm-opt`, Asyncify untuk
      # korutin), sidiknya dipatok (rantai pasok).
      - name: Tembolok alat WASI
        uses: actions/cache@v4
        with:
          path: ~/.cache/jrgm/wasi
          key: wasi-sdk-34-binaryen-133

      # Node 24: rekursi 20 ribu tingkat lewat --emit-wasm keluar 1 tanpa keluaran di node bawaan image.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Alat WASI (--emit-wasm)
        run: |
          rustup target add wasm32-wasip1
          mkdir -p ~/.cache/jrgm/wasi/rt && cd ~/.cache/jrgm/wasi
          if [ ! -d wasi-sysroot-34.0 ] || [ ! -d rt/libclang_rt-34.0 ]; then
            u=https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34
            curl -sSfL -o sysroot.tgz $u/wasi-sysroot-34.0.tar.gz
            curl -sSfL -o rt.tgz $u/libclang_rt-34.0.tar.gz
            echo "9d813544eeebe38b7b8f2244ed591de46b6db812c6dd1a257ff9f0d2a905a2be  sysroot.tgz" | sha256sum -c -
            echo "eee3e634dcf71aa22b1333391623cf5c9965a637dc428a27b1a858c026c587f1  rt.tgz" | sha256sum -c -
            tar xzf sysroot.tgz && tar xzf rt.tgz -C rt && rm sysroot.tgz rt.tgz
          fi
          if [ ! -x binaryen-version_133/bin/wasm-opt ]; then
            curl -sSfL -o bny.tgz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
            echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  bny.tgz" | sha256sum -c -
            tar xzf bny.tgz && rm bny.tgz
          fi
          (cd $GITHUB_WORKSPACE/runtime && cargo build --release --target wasm32-wasip1)

      # `JRG_SOPAN` sengaja tidak diset: `tests/nada.rs` menguji sapaan yang
      # variabel itu matikan.
      - name: Bangun tes
        run: cargo test --release -j 1 --no-run

      # Di dalam PID namespace, seperti di mesin pengembang: beberapa tes mengirim sinyal ke proses. Tiap biner tes
      # jalan sendiri dengan keluaran langsung ke log, dan memori dicatat tiap 20 detik — job yang dibunuh di
      # tengah jalan (3 kali, menit ke-23 sampai 27) tetap meninggalkan jejak tes mana dan memori berapa.
      - name: Suite
        env:
          RUST_TEST_THREADS: "2"
          # Alat `--emit-wasm` yang hilang di CI = gagal, bukan tes yang dilewati diam-diam.
          JRG_WASI_WAJIB: "1"
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          ( while true; do echo "[mem $(date +%T)] $(free -m | awk '/Mem/ {print "pakai", $3, "sedia", $7}') | $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s:%dM ", $2, $1/1024}')"; sleep 20; done ) &
          pantau=$!
          set +e
          rc=0
          for t in lib bins $(ls tests/*.rs | xargs -n1 basename | sed 's/\.rs$//'); do
            case $t in lib) a="--lib" ;; bins) a="--bins" ;; *) a="--test $t" ;; esac
            # Tes LLVM berbatas 5 GB per proses: biner uji yang rakus gagal "memori habis" dan disebut namanya oleh
            # tesnya, alih-alih menghabiskan runner 8 GB (terukur: `uji.bin` 7 GB, job mati tanpa pesan).
            batas=unlimited; case $t in llvm_*) batas=5000000 ;; esac
            echo "::group::cargo test $a (ulimit -v $batas)"
            setsid --wait unshare -U --map-current-user -m -p -f --mount-proc sh -c "ulimit -v $batas; exec env -u JRG_SOPAN cargo test --release -j 1 --no-fail-fast $a" 2>&1 | tee -a suite.log
            r=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "== $t selesai, kode $r"
            [ $r -eq 0 ] || rc=1
          done
          kill $pantau
          exit $rc
        shell: bash

      - name: Ringkasan suite
        if: always()
        run: |
          grep '^test result' suite.log | awk '{l+=$4; g+=$6} END {print "lulus", l, "gagal", g}'
          grep -E '^test .* FAILED' suite.log || true
          grep -A30 '^---- ' suite.log | head -300 || true
          free -m; sudo dmesg | tail -20 || true

      - name: Simpan log suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: suite.log

      - name: Salin pustaka jadi
        run: cp runtime/target/release/libjrgrt.a jembatan/target/release/libjrgjembatan.so target/release/

      - name: Uji asap
        run: sh rilis/uji_asap.sh target/release "$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
